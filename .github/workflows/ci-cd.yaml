name: CI/CD Automation Build

# Kích hoạt workflow khi có sự kiện push hoặc pull_request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Bài 4: Cấu hình Matrix Strategy để chạy đồng thời trên 3 hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      # set fail-fast là false để nếu một OS lỗi, các OS khác vẫn tiếp tục chạy
      fail-fast: false
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Bài 5: Chạy lệnh verify. 
    # Lệnh này sẽ thực hiện: Checkstyle -> Unit Test -> JaCoCo Report -> JaCoCo Check (80%)
    - name: Chạy Maven Build và Kiểm tra chất lượng (Verify)
      run: mvn -B verify

    # Lưu trữ file thực thi .jar sau khi build thành công
    - name: Lưu trữ Artifact (.jar file)
      uses: actions/upload-artifact@v4
      if: success() 
      with:
        name: worker-system-jar-${{ matrix.os }}
        path: target/*.jar
        retention-days: 7

    # Bài 5: Lưu trữ báo cáo độ bao phủ mã nguồn (JaCoCo HTML)
    # Sử dụng "if: always()" để luôn có báo cáo ngay cả khi build bị fail do coverage thấp
    - name: Lưu trữ Báo cáo JaCoCo (HTML)
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: jacoco-report-${{ matrix.os }}
        path: target/site/jacoco/
        retention-days: 7