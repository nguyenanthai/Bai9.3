name: CI/CD Automation Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 1. Khai báo Matrix Strategy tại đây
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # 2. Thay vì fix cứng ubuntu, chạy theo biến os trong matrix
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Chạy Maven Build (Test và Package)
      run: mvn -B test package

    - name: Lưu trữ Artifact (.jar file)
      uses: actions/upload-artifact@v4
      if: success() 
      with:
        # Thêm tên hệ điều hành vào file zip để không bị ghi đè
        name: worker-system-jar-${{ matrix.os }} 
        path: target/*.jar
        retention-days: 7