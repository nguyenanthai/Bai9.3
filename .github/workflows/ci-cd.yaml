name: CI/CD Automation Build

# 1. TRIGGER: Chạy khi có push hoặc pull_request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # QUAN TRỌNG: Cấp quyền cho GitHub Actions được phép đăng comment vào Pull Request
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Chạy Maven Build và Kiểm tra chất lượng (Verify)
        run: mvn -B verify

      # 2. INLINE FEEDBACK: Bot tự động comment lỗi Checkstyle vào PR
      # Dùng if: always() để bot vẫn chạy đọc lỗi dù bước Maven phía trên bị fail
      - name: Inline Feedback - Checkstyle Bot
        uses: dbelyaev/action-checkstyle@master
        if: always() && github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          # Đường dẫn mặc định Maven sinh ra file báo cáo Checkstyle
          checkstyle_report: target/checkstyle-result.xml